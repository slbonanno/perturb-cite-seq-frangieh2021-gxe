# =============================================================================
# ADT panel definition and pathway gene sets
#
# !! THE adt_to_rna MAP BELOW IS A STUB !!
# The 20-plex panel members must be read off adt.var_names in notebook 01.
# nb01 writes the observed panel to config/panels_observed.yaml; reconcile it
# with this file and commit the result. Do not guess antibody clones.
# =============================================================================

adt:
  isotype_controls: [Rat_IgG2a, Mouse_IgG1, Mouse_IgG2a, Mouse_IgG2b]

  adt_to_rna:
    CD117:  [KIT]
    CD119:  [IFNGR1]
    CD140a: [PDGFRA]
    CD140b: [PDGFRB]
    CD172a: [SIRPA]
    CD184:  [CXCR4]
    CD202b: [TEK]
    CD274:  [CD274]                    # PD-L1
    CD29:   [ITGB1]
    CD309:  [KDR]
    CD44:   [CD44]
    CD47:   [CD47]
    CD49f:  [ITGA6]
    CD58:   [CD58]
    CD59:   [CD59]
    CD61:   [ITGB3]
    CD9:    [CD9]
    CD279:  [PDCD1]                    # PD-1; T cell marker, treat as contamination diagnostic
    HLA_A:  [HLA-A, HLA-B, HLA-C]      # clone W6/32 = pan-MHC-I, NOT HLA-A alone
    HLA_E:  [HLA-E]

  # Epitopes requiring B2M for surface presentation. Loss of signal here on a
  # B2M perturbation is an assembly effect, not post-transcriptional regulation
  # of the heavy chain. Flag these separately in the nb04 quadrant analysis.
  b2m_dependent: [HLA_A, HLA_E]

  markers_of_interest: [CD58, HLA_A, HLA_E, CD274, CD119]

  annotations:
    CD274:  "PD-L1: inhibits T cell activation"
    CD279:  "PD-1: T cell inhibitory receptor"
    CD119:  "IFNGR1: R for IFN-γ"
    HLA_A:  "pan-MHC-I (W6/32) - needs β2m"
    HLA_E:  "HLA-E: non-classical MHC-I, inh NK"
    CD58:   "LFA-3: costim T/NK via CD2"
    CD59:   "protectin: blocks cmplmnt membr attack cmplx"
    CD47:   "binds SIRPα, blocks phagocytosis"
    CD44:   "hyaluronan R: adhesion, migration — near-ubiquitous"
    CD29:   "ITGB1: integrin β1, ECM adhesion — near-ubiquitous"
    CD49f:  "ITGA6: integrin α6, laminin binding"
    CD61:   "ITGB3: integrin β3, pair w αv for vitronectin"
    CD9:    "tetraspanin: membrane organiser — broadly expressed"
    CD117:  "KIT: SCF R, melanocyte lineage"
    CD184:  "CXCR4: CXCL12 R, migration + homing"
    CD172a: "SIRPα: binds CD47 — myeloid, not melanoma"
    CD140a: "PDGFRA: mesenchymal/fibroblast"
    CD140b: "PDGFRB: pericyte/mesenchymal"
    CD202b: "TIE2: angiopoietin R, endothelial"
    CD309:  "KDR/VEGFR2: VEGF R, endothelial"

# -----------------------------------------------------------------------------
# Pathway gene sets for nb02/nb03 scoring.
# Kept small and hand-curated on purpose: these are the pathways with a strong
# prior in this system, so recovering them is a sanity check, not a discovery.
# Broader enrichment (GSEA / decoupler) runs against MSigDB in nb03.
# -----------------------------------------------------------------------------
gene_sets:
  ifng_jak_stat:
    - IFNGR1
    - IFNGR2
    - JAK1
    - JAK2
    - STAT1
    - STAT2
    - IRF1
    - IRF9
    - SOCS1
    - GBP1
    - GBP2

  antigen_presentation_mhc_i:
    - B2M
    - HLA-A
    - HLA-B
    - HLA-C
    - TAP1
    - TAP2
    - TAPBP
    - NLRC5
    - PSMB8
    - PSMB9
    - CALR
    - CANX

  immune_checkpoint_ligands:
    - CD274      # PD-L1
    - PDCD1LG2   # PD-L2
    - CD58
    - CD47
    - LGALS9

  # Melanoma cell-state axes -- useful for asking whether a perturbation moves
  # cells along a differentiation axis rather than an immune axis.
  melanoma_state:
    melanocytic:
      - MITF
      - PMEL
      - TYR
      - DCT
      - MLANA
    mesenchymal_like:
      - AXL
      - NGFR
      - SOX9
      - WNT5A

# -----------------------------------------------------------------------------
# MSigDB collections pulled via decoupler/gseapy in nb03
# -----------------------------------------------------------------------------
msigdb:
  collections:
    - hallmark
    - reactome
  organism: human
  min_set_size: 10
  max_set_size: 500


